services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: always
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://crm:${DB_PASSWORD:-change-me}@db:5432/crm
    ports:
      - "3000:3000"
volumes:
  pgdata:
